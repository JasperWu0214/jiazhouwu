name: Refresh GitHub contributions
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: contribution-sync
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sync-contributions.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add github-contributions.json
          git diff --cached --quiet || git commit -m 'Refresh GitHub contribution calendar'
          git push
