  <text x="72" y="430" font-size="27" font-weight="700">1. Shell 到底是什么？</text>
  <rect x="72" y="455" width="1056" height="50" fill="#161b22" stroke="#30363d"/>
  <text x="91" y="487" font-size="19" font-weight="600">Cue / 自测问题</text>
  <text x="378" y="487" font-size="19" font-weight="600">Notes</text>
  <rect x="72" y="505" width="1056" height="83" fill="#0d1117" stroke="#30363d"/>
  <line x1="357" y1="455" x2="357" y2="671" class="rule"/>
  <text x="91" y="548" font-size="19">Shell 是什么？</text>
  <text x="378" y="539" font-size="19">文本形式控制计算机的接口。你输入命令，Shell 解析命令、</text>
  <text x="378" y="568" font-size="19">找到程序并运行它。</text>
  <rect x="72" y="588" width="1056" height="83" fill="#0d1117" stroke="#30363d"/>
  <text x="91" y="632" font-size="19">Terminal 和 Shell</text>
  <text x="91" y="658" font-size="19">是一回事吗？</text>
  <text x="378" y="622" font-size="19">不是。Terminal 是你看到的窗口或界面；Shell 是运行在里面、</text>
  <text x="378" y="651" font-size="19">解释命令的程序。</text>
  <text x="73" y="727" class="muted" font-size="17">Lecture 1 · Course Overview + Shell · Cornell method</text>
